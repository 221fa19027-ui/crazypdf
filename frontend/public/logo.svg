<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Document Shape with smooth rounded corners -->
  <rect x="22" y="16" width="60" height="88" rx="14" fill="url(#primaryGrad)" />
  
  <!-- Folded Corner accent -->
  <path d="M58 16 H70 C76.627 16 82 21.373 82 28 V40 H58 V16Z" fill="#38bdf8" opacity="0.85" />
  <path d="M58 40 L82 40 L58 16 Z" fill="#1e1b4b" opacity="0.25" />

  <!-- Dynamic "Crazy Bolt / C Fold" Cutout Symbol -->
  <path d="M46 36 L66 36 L52 56 L68 56 L40 86 L48 64 L36 64 Z" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.15))" />

  <!-- Accent Orb / Energy Dot -->
  <circle cx="88" cy="88" r="14" fill="url(#accentGrad)" />
  <path d="M83 88L87 92L94 85" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
