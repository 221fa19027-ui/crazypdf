version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: crazypdf-postgres
    restart: always
    environment:
      POSTGRES_USER: crazypdf_user
      POSTGRES_PASSWORD: crazypdf_password_secret
      POSTGRES_DB: crazypdf
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crazypdf_user -d crazypdf"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crazypdf-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crazypdf-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://crazypdf_user:crazypdf_password_secret@db:5432/crazypdf
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: crazypdf-production-secret-key-change-in-env-987654321
      FILE_EXPIRATION_MINUTES: 60
      TEMP_STORAGE_DIR: /tmp_storage
    volumes:
      - temp_storage:/tmp_storage
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crazypdf-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  temp_storage:
