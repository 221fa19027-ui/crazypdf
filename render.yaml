services:
  # ─── FastAPI Backend Web Service ──────────────────────────────────────────
  - type: web
    name: crazypdf-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PROJECT_NAME
        value: CrazyPDF
      - key: VERSION
        value: 1.0.0
      - key: SECRET_KEY
        generateValue: true
      - key: FILE_EXPIRATION_MINUTES
        value: "60"
      - key: TEMP_STORAGE_DIR
        value: "./tmp_storage"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./crazypdf.db"
      - key: CORS_ORIGINS
        value: "https://crazypdf-frontend.onrender.com,http://localhost:5173"

  # ─── React Vite Frontend Static Site ─────────────────────────────────────
  - type: web
    name: crazypdf-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: crazypdf-backend
          property: host
          # Will resolve to https://crazypdf-backend.onrender.com/api/v1
